spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 192.168.70.128
      port: 6379
  datasource:
    jdbc-url: jdbc:log4jdbc:mysql://localhost:3306/redis?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: strawberry0702
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
  servlet:
    session:
      cookie:
        name: JSESSIONID
server:
  port: 9000

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui-custom.html
    enabled: true
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  model-and-view-allowed: true

kafka:
  bootstrap-servers: 192.168.70.128:9094
  acks: 1
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  value-serializer: org.springframework.kafka.support.serializer.JsonSerializer