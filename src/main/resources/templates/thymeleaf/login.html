<!-- login page -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link rel="stylesheet" href="/templates/thymeleaf/css/mainStyle.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>

<th:block th:fragment="content">
    <div class="container">
        <h1> 로그인 </h1>

        <form action="/redis/v1/login-process" method="post">
            <div class="form-group">
                <label th:for="userId">아이디</label>
                <input type="text" name="userId" class="form-control" placeholder="아이디를 입력해주세요">
            </div>
            <div class="form-group">
                <label th:for="userPw">비밀번호</label>
                <input type="password" name="userPw" class="form-control" placeholder="비밀번호를 입력해주세요">
            </div>
            <button type="submit" class="btn btn-primary">로그인</button>
            <button type="button" class="btn btn-primary" onClick="location.href='signUp'">회원가입</button>

        </form>
        <br/>
    </div>
</th:block>

<script src="//code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

</body>
</html>
